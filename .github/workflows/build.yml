name: Mesin Build (Flutter & Kotlin)

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: 'Link Direct Download ZIP Source Code'
        required: true
        type: string
      framework:
        description: 'Pilih: flutter atau kotlin'
        required: true
        type: choice
        options:
          - flutter
          - kotlin
      icon_url:
        description: 'URL Custom Icon (Opsional)'
        required: false
        type: string
      mode:
        description: 'build = compile jadi APK, modify = cuma kustomisasi source lalu dikemas ZIP'
        required: false
        type: choice
        default: build
        options:
          - build
          - modify
      new_app_name:
        description: 'Nama Aplikasi Baru (Opsional)'
        required: false
        type: string
      new_package_name:
        description: 'Package Name / Application ID Baru, misal com.contoh.app (Opsional)'
        required: false
        type: string
      new_app_version:
        description: 'Versi Aplikasi Baru, misal 1.2.0 (Opsional)'
        required: false
        type: string

jobs:
  build-app:
    name: Proses Build
    runs-on: ubuntu-latest

    steps:
      - name: Hapus sisa file lama
        run: rm -rf target_repo source.zip

      - name: Buat Folder Target
        run: mkdir target_repo

      - name: Download & Extract File ZIP
        run: |
          echo "📥 Mendownload file ZIP dari: ${{ inputs.zip_url }}"
          curl -sL -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -o source.zip "${{ inputs.zip_url }}"

          echo "🔍 Cek hasil download..."
          ls -la source.zip
          FILE_TYPE=$(file -b source.zip)
          echo "Tipe file: $FILE_TYPE"

          if [[ "$FILE_TYPE" != *"Zip archive"* ]]; then
            echo "❌ ERROR: File yang kedownload BUKAN zip asli (kemungkinan link salah / bukan direct link / private repo)."
            echo "--- Isi 300 karakter pertama file (buat debug) ---"
            head -c 300 source.zip
            exit 1
          fi

          echo "📦 Mengekstrak file ZIP..."
          unzip -q source.zip -d target_repo/
          
          cd target_repo
          if [ $(ls -1A | wc -l) -eq 1 ] && [ -d $(ls -1A) ]; then
            mv $(ls -1A)/* ./
            mv $(ls -1A)/.* ./ 2>/dev/null || true
          fi
          cd ..
          
          rm source.zip

      - name: Bersihkan Cache & Build Lama
        working-directory: ./target_repo
        run: |
          echo "🧹 Membersihkan sisa cache/build lama dari ZIP (kalau ada)..."

          if [ "${{ inputs.framework }}" == "flutter" ]; then
            rm -rf .dart_tool build android/.gradle android/app/build \
                   android/.idea ios/Pods ios/.symlinks ios/Flutter/Flutter.framework \
                   .flutter-plugins .flutter-plugins-dependencies .packages
            echo "✅ Cache Flutter dibersihkan (.dart_tool, build/, android/.gradle, ios/Pods, dll)."
          else
            rm -rf build app/build .gradle .idea out
            echo "✅ Cache Kotlin/Gradle dibersihkan (build/, .gradle/, .idea/, dll)."
          fi

      - name: Pasang Custom Icon
        if: ${{ inputs.icon_url != '' }}
        working-directory: ./target_repo
        run: |
          echo "🎨 Mendownload custom icon..."
          curl -sL -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -o custom_icon.png "${{ inputs.icon_url }}"

          echo "🔍 Cek hasil download icon:"
          ls -la custom_icon.png
          file custom_icon.png

          echo "📦 Menginstall ImageMagick (belum ada bawaan di runner)..."
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick

          echo "🔍 Cek ImageMagick tersedia:"
          which convert || echo "❌ convert TIDAK ditemukan di runner!"
          convert -version || true

          echo "⚙️ Memproses dan menimpa icon bawaan..."
          if [ "${{ inputs.framework }}" == "kotlin" ]; then
            RES_DIR="app/src/main/res"
          else
            RES_DIR="android/app/src/main/res"
          fi

          echo "🔍 Mengecek folder mipmap yang tersedia di $RES_DIR ..."
          ls -d $RES_DIR/mipmap-*/ 2>/dev/null || echo "⚠️ Tidak ada folder mipmap-* ditemukan!"

          if [ -d "$RES_DIR/mipmap-anydpi-v26" ]; then
            echo "🗑️ Menghapus adaptive icon (mipmap-anydpi-v26) supaya PNG custom kepakai..."
            rm -rf "$RES_DIR/mipmap-anydpi-v26"
          fi

          for dir in $RES_DIR/mipmap-*/; do
            if [ -d "$dir" ]; then
              echo "➡️ Menimpa icon di: $dir"
              rm -f "${dir}ic_launcher.webp" "${dir}ic_launcher_round.webp"
              convert custom_icon.png -resize 192x192 "${dir}ic_launcher.png"
              convert custom_icon.png -resize 192x192 "${dir}ic_launcher_round.png"
              echo "   Hasil ic_launcher.png:"
              ls -la "${dir}ic_launcher.png"
            fi
          done

          if ! ls -d $RES_DIR/mipmap-*/ >/dev/null 2>&1; then
            echo "⚠️ Tidak ada folder mipmap sama sekali, membuat mipmap-xxhdpi manual..."
            mkdir -p "$RES_DIR/mipmap-xxhdpi"
            convert custom_icon.png -resize 192x192 "$RES_DIR/mipmap-xxhdpi/ic_launcher.png" 2>/dev/null || true
            convert custom_icon.png -resize 192x192 "$RES_DIR/mipmap-xxhdpi/ic_launcher_round.png" 2>/dev/null || true
          fi

          echo "✅ Custom Icon berhasil dipasang!"

      - name: Ganti Nama Aplikasi, Package Name & Versi
        if: ${{ inputs.new_app_name != '' || inputs.new_package_name != '' || inputs.new_app_version != '' }}
        working-directory: ./target_repo
        run: |
          echo "🔧 Menerapkan kustomisasi source code..."

          if [ "${{ inputs.framework }}" == "kotlin" ]; then
            SRC_ROOT="app/src/main"
            GRADLE_FILE="app/build.gradle"
            [ -f "$GRADLE_FILE" ] || GRADLE_FILE="app/build.gradle.kts"
          else
            SRC_ROOT="android/app/src/main"
            GRADLE_FILE="android/app/build.gradle"
            [ -f "$GRADLE_FILE" ] || GRADLE_FILE="android/app/build.gradle.kts"
          fi

          if [ "${{ inputs.new_app_name }}" != "" ]; then
            NEW_NAME="${{ inputs.new_app_name }}"
            echo "📝 Mengganti nama aplikasi jadi: $NEW_NAME"

            if [ ! -f "$SRC_ROOT/AndroidManifest.xml" ]; then
              echo "⚠️ AndroidManifest.xml tidak ditemukan, lewati penggantian nama aplikasi."
            else
              sed -i "s/android:label=\"[^\"]*\"/android:label=\"${NEW_NAME}\"/g" "$SRC_ROOT/AndroidManifest.xml"
              echo "✅ Nama aplikasi berhasil diganti di AndroidManifest.xml"
            fi
          fi

          if [ "${{ inputs.new_app_version }}" != "" ]; then
            NEW_VER="${{ inputs.new_app_version }}"
            echo "📝 Mengganti versi aplikasi jadi: $NEW_VER"

            if [ ! -f "$GRADLE_FILE" ]; then
              echo "⚠️ $GRADLE_FILE tidak ditemukan, lewati penggantian versi."
            else
              sed -i "s/versionName[[:space:]]*=?[[:space:]]*\"[^\"]*\"/versionName = \"${NEW_VER}\"/g" "$GRADLE_FILE"
              sed -i "s/versionName[[:space:]]*=?[[:space:]]*'[^']*'/versionName = \"${NEW_VER}\"/g" "$GRADLE_FILE"
              echo "✅ Versi aplikasi berhasil diganti."
            fi
          fi

          if [ "${{ inputs.new_package_name }}" != "" ]; then
            NEW_PKG="${{ inputs.new_package_name }}"
            echo "📦 Mengganti package name jadi: $NEW_PKG"

            if [ ! -f "$GRADLE_FILE" ]; then
              echo "⚠️ $GRADLE_FILE tidak ditemukan, lewati penggantian package name."
            else
              OLD_PKG=$(grep -oE 'applicationId[[:space:]]*=?[[:space:]]*"[^"]*"' "$GRADLE_FILE" | grep -oE '"[^"]*"' | tr -d '"' | head -1)
              if [ -z "$OLD_PKG" ]; then
                OLD_PKG=$(grep -oE 'namespace[[:space:]]*=?[[:space:]]*"[^"]*"' "$GRADLE_FILE" | grep -oE '"[^"]*"' | tr -d '"' | head -1)
              fi

              if [ -z "$OLD_PKG" ]; then
                echo "⚠️ Tidak bisa deteksi package name lama dari $GRADLE_FILE, lewati penggantian package name."
              else
                echo "🔍 Package name lama terdeteksi: $OLD_PKG"

                sed -i -E "s/applicationId[[:space:]]*=?[[:space:]]*\"[^\"]*\"/applicationId = \"${NEW_PKG}\"/g" "$GRADLE_FILE"
                sed -i -E "s/namespace[[:space:]]*=?[[:space:]]*\"[^\"]*\"/namespace = \"${NEW_PKG}\"/g" "$GRADLE_FILE"

                MANIFEST="$SRC_ROOT/AndroidManifest.xml"
                [ -f "$MANIFEST" ] && sed -i "s|package=\"${OLD_PKG}\"|package=\"${NEW_PKG}\"|g" "$MANIFEST"

                OLD_PATH=$(echo "$OLD_PKG" | tr '.' '/')
                NEW_PATH=$(echo "$NEW_PKG" | tr '.' '/')

                for LANG_DIR in kotlin java; do
                  BASE_DIR="$SRC_ROOT/$LANG_DIR"
                  if [ -d "$BASE_DIR/$OLD_PATH" ]; then
                    echo "➡️ Memindahkan source dari $BASE_DIR/$OLD_PATH ke $BASE_DIR/$NEW_PATH"
                    mkdir -p "$BASE_DIR/$NEW_PATH"
                    find "$BASE_DIR/$OLD_PATH" -mindepth 1 -maxdepth 1 -exec mv {} "$BASE_DIR/$NEW_PATH/" \;

                    OLD_PARENT="$BASE_DIR/$OLD_PATH"
                    while [ "$OLD_PARENT" != "$BASE_DIR" ] && [ -d "$OLD_PARENT" ] && [ -z "$(ls -A "$OLD_PARENT")" ]; do
                      rmdir "$OLD_PARENT"
                      OLD_PARENT=$(dirname "$OLD_PARENT")
                    done

                    find "$BASE_DIR/$NEW_PATH" -type f \( -name "*.kt" -o -name "*.java" \) -exec sed -i "s/^package ${OLD_PKG}/package ${NEW_PKG}/" {} \;
                    echo "✅ Source code $LANG_DIR dipindah & deklarasi package diperbarui."
                  fi
                done

                echo "✅ Package name berhasil diganti dari $OLD_PKG ke $NEW_PKG"
                if [ "${{ inputs.framework }}" == "flutter" ]; then
                  echo "⚠️ CATATAN: Ini cuma mengganti Application ID Android-nya. Kode Dart (import package:xxx/...) TIDAK ikut berubah, itu package Dart terpisah (lihat 'name:' di pubspec.yaml)."
                fi
              fi
            fi
          fi

          echo "✅ Kustomisasi selesai."

      - name: Pengecekan Integritas & Auto-Fix File
        working-directory: ./target_repo
        run: |
          echo "🔍 Memulai pengecekan struktur repository..."

          if [ "${{ inputs.framework }}" == "kotlin" ]; then
            if [ ! -f "build.gradle" ] && [ ! -f "build.gradle.kts" ]; then
              echo "❌ ERROR: Repository tidak valid. File build.gradle(.kts) utama tidak ditemukan!"
              exit 1
            fi

            if [ ! -f "app/build.gradle" ] && [ ! -f "app/build.gradle.kts" ]; then
              echo "❌ ERROR: File app/build.gradle(.kts) tidak ditemukan!"
              exit 1
            fi

            if [ ! -f "local.properties" ]; then
              echo "🔧 Memperbaiki: Membuat file local.properties otomatis..."
              echo "sdk.dir=$ANDROID_HOME" > local.properties
            fi
          fi

          if [ "${{ inputs.framework }}" == "flutter" ]; then
            if [ ! -f "pubspec.yaml" ]; then
              echo "❌ ERROR: Repository bukan project Flutter. File pubspec.yaml tidak ditemukan!"
              exit 1
            fi
          fi

          echo "✅ Pengecekan selesai. Struktur aman!"

      # ============================================================================
      # 🆕 AUTO-FIX FAICONDATA STEP - INJECTED SEBELUM BUILD
      # ============================================================================
      - name: 🔧 AUTO-FIX FaIconData Incompatibility (Flutter 3.44.8+)
        if: ${{ inputs.mode == 'build' && inputs.framework == 'flutter' }}
        working-directory: ./target_repo
        run: |
          echo "🔧 Memulai AUTO-FIX untuk FaIconData incompatibility..."
          echo ""

          # Cek apakah font_awesome_flutter digunakan
          if ! grep -q "font_awesome_flutter" pubspec.yaml; then
            echo "⏭️  font_awesome_flutter tidak ditemukan, skip auto-fix."
            exit 0
          fi

          echo "✅ font_awesome_flutter terdeteksi, scanning untuk Icon(FontAwesomeIcons.*) pattern..."
          echo ""

          # Step 1: Find files dengan Icon(FontAwesomeIcons.
          FOUND_ERRORS=$(grep -r "Icon(FontAwesomeIcons\." lib/ --include="*.dart" 2>/dev/null | wc -l)

          if [ "$FOUND_ERRORS" -eq 0 ]; then
            echo "✅ Tidak ada Icon(FontAwesomeIcons.*) pattern ditemukan."
            exit 0
          fi

          echo "⚠️  Menemukan $FOUND_ERRORS baris dengan Icon(FontAwesomeIcons.*)"
          echo ""

          # Step 2: Add imports to all files
          echo "📝 Menambahkan import font_awesome_flutter ke file yang perlu..."
          while IFS= read -r file; do
            if [ -n "$file" ]; then
              if ! grep -q "import.*font_awesome_flutter.*font_awesome_flutter" "$file"; then
                first_import_line=$(grep -n "^import" "$file" | head -1 | cut -d: -f1)
                if [ -n "$first_import_line" ]; then
                  sed -i "${first_import_line}i import 'package:font_awesome_flutter/font_awesome_flutter.dart';" "$file"
                else
                  sed -i "1i import 'package:font_awesome_flutter/font_awesome_flutter.dart';\n" "$file"
                fi
                echo "  ✅ $file"
              fi
            fi
          done < <(grep -r "Icon(FontAwesomeIcons\." lib/ --include="*.dart" 2>/dev/null | cut -d: -f1 | sort -u)

          echo ""

          # Step 3: Replace Icon(FontAwesomeIcons. dengan FaIcon(FontAwesomeIcons.
          echo "📝 Mengganti Icon(FontAwesomeIcons. → FaIcon(FontAwesomeIcons...."
          find lib/ -name "*.dart" -type f -exec sed -i 's/Icon(FontAwesomeIcons\./FaIcon(FontAwesomeIcons\./g' {} +
          echo "✅ Replacement selesai"
          echo ""

          # Step 4: Verify
          echo "📊 Verifikasi hasil..."
          remaining=$(grep -r "Icon(FontAwesomeIcons\." lib/ --include="*.dart" 2>/dev/null | wc -l)
          faicon_count=$(grep -r "FaIcon(FontAwesomeIcons\." lib/ --include="*.dart" 2>/dev/null | wc -l)

          echo "   • Icon(FontAwesomeIcons) tersisa: $remaining"
          echo "   • FaIcon(FontAwesomeIcons) sekarang: $faicon_count ✅"
          echo ""

          if [ "$remaining" -eq 0 ]; then
            echo "✅ AUTO-FIX BERHASIL! Siap untuk flutter build."
          else
            echo "⚠️  $remaining baris masih berisi Icon(FontAwesomeIcons (mungkin format berbeda)"
            echo "   Coba manual fix atau review error build untuk detailnya."
          fi
          echo ""

      - name: Install Java 17
        if: ${{ inputs.mode == 'build' }}
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Mesin Flutter
        if: ${{ inputs.mode == 'build' && inputs.framework == 'flutter' }}
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build Flutter APK
        if: ${{ inputs.mode == 'build' && inputs.framework == 'flutter' }}
        working-directory: ./target_repo
        run: |
          flutter pub get
          flutter build apk --release

      - name: Pengecekan & Auto-Fix Gradle Wrapper
        if: ${{ inputs.mode == 'build' && inputs.framework == 'kotlin' }}
        working-directory: ./target_repo
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "⚠️ File gradlew tidak ditemukan di repository!"
            echo "🔧 Meng-generate ulang Gradle Wrapper secara otomatis..."
            gradle wrapper
          else
            echo "✅ File gradlew ditemukan."
          fi
          
          chmod +x ./gradlew

      - name: Auto-Generate Debug Keystore
        if: ${{ inputs.mode == 'build' && inputs.framework == 'kotlin' }}
        working-directory: ./target_repo
        run: |
          echo "🔑 Membuat file debug.keystore dadakan..."
          keytool -genkeypair -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          echo "✅ Keystore berhasil dibuat!"

      - name: Build Kotlin APK
        if: ${{ inputs.mode == 'build' && inputs.framework == 'kotlin' }}
        working-directory: ./target_repo
        run: ./gradlew assembleDebug -Djava.awt.headless=true --no-daemon

      - name: Simpan Hasil APK Flutter
        if: ${{ success() && inputs.mode == 'build' && inputs.framework == 'flutter' }}
        uses: actions/upload-artifact@v4
        with:
          name: Hasil-Build
          path: target_repo/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 5

      - name: Simpan Hasil APK Kotlin
        if: ${{ success() && inputs.mode == 'build' && inputs.framework == 'kotlin' }}
        uses: actions/upload-artifact@v4
        with:
          name: Hasil-Build
          path: target_repo/app/build/outputs/apk/debug/*.apk
          retention-days: 5

      - name: Kemas Ulang Source Code Jadi ZIP
        if: ${{ success() && inputs.mode == 'modify' }}
        working-directory: ./target_repo
        run: |
          echo "📦 Mengemas source code hasil kustomisasi jadi ZIP..."
          sudo apt-get update -qq && sudo apt-get install -y -qq zip
          zip -qr ../hasil-modifikasi.zip .
          cd ..
          echo "🔍 Cek hasil ZIP:"
          ls -la hasil-modifikasi.zip

      - name: Simpan Hasil ZIP
        if: ${{ success() && inputs.mode == 'modify' }}
        uses: actions/upload-artifact@v4
        with:
          name: Hasil-Build
          path: hasil-modifikasi.zip
          retention-days: 5
